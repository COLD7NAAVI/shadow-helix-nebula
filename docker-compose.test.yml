services:
  test-postgres:
    image: postgres:17-alpine
    container_name: shn-test-postgres
    environment:
      POSTGRES_DB: shn_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shn_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
